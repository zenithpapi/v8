<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Primary metadata -->
    <meta name="description" content="Zenith trading platform.">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="theme-color" content="#0b57a4">
    <meta name="referrer" content="no-referrer">

    <!-- Fonts: local-only for packaged APK/webview usage -->
    <link rel="stylesheet" href="assets/fonts/inter.css">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/images/zenith-mark.svg">
    <link rel="shortcut icon" href="assets/images/zenith-mark.svg">

    <div class="app" id="app">
        <!-- Modules load here -->

    <nav class="bottom-nav" id="bottomNav" style="display:none;">

            <span class="material-symbols-rounded">home</span>

        </div>


        <div class="nav" data-page="lockin" onclick="openPage('lockin', this)">
            <span class="material-symbols-rounded">lock</span>

        </div>

            <span class="material-symbols-rounded">person</span>
            <div>Profile</div>
        </div>


    </nav>



    <script src="assets/js/app.js" defer></script>
    <script src="assets/js/cache-version.js" defer></script>
