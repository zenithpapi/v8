   <section id="profile">
    <header class="header">
     <div>
      <div class="logo"><img src="assets/images/zenith-mark.svg" alt="Zenith logo" class="brand-logo"><div class="brand-text">ZENITH <span>ACCOUNT</span></div>
      </div>
      <div class="subtitle"> User settings </div>
     </div>
     <div class="profile"> <span class="material-symbols-rounded">person</span> </div>
    </header>

    <div class="card portfolio app-hero" style="padding:20px;">
     <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
      <div style="width:48px; height:48px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.2rem; font-weight:700;" id="profileInitial">P</div>
      <div style="flex:1; min-width:0;">
       <h2 id="profileName" style="margin:0; font-size:1.05rem;">Loading...</h2>
       <div style="display:flex; align-items:center; gap:8px; margin-top:3px;">
        <div class="subtitle" id="profileRole">Zenith Trader</div>
        <button id="copyReferralCodeBtn" class="btn" type="button" onclick="copyReferralCode()" aria-label="Copy referral code" title="Copy referral code" style="padding:6px; font-size:13px; width:auto; height:32px;">
         <span class="material-symbols-rounded" aria-hidden="true">content_copy</span>
        </button>
       </div>
      </div>
     </div>
     <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
      <div class="ai-status" id="profileStatus" style="padding:6px 10px; border-radius:999px;">VERIFIED MEMBER</div>
     </div>
    </div>

    <div class="card" id="referralCard" style="display:none;">
     <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px; font-weight:600; color:#333;">
      <span class="material-symbols-rounded"> link </span>
      <span>Referral Link</span>
     </div>
     <div style="display:flex; gap:8px;">
      <input id="referralLinkInput" type="text" value="" readonly style="flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--border); font-size:13px;" />
      <button type="button" class="btn" onclick="copyReferralLink()" style="width:auto; padding:10px 12px; font-size:13px; min-width:90px;">Copy</button>
     </div>
    </div>

    <div class="card">
     <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px; font-weight:600; color:#333;">
      <span class="material-symbols-rounded"> person </span>
      <span>Profile Details</span>
     </div>
     <div class="row">
      <span>
       <span class="material-symbols-rounded"> badge </span> Full Name </span>
      <span id="detailFullName" style="font-size:13px; color:var(--muted);">-</span>
     </div>
     <div class="row">
      <span>
       <span class="material-symbols-rounded"> call </span> Phone </span>
      <span id="detailPhone" style="font-size:13px; color:var(--muted);">-</span>
     </div>
     <div class="row">
      <span>
       <span class="material-symbols-rounded"> group </span> Referred By </span>
      <span id="detailSponsor" style="font-size:13px; color:var(--muted);">-</span>
     </div>
    </div>

    <div class="card">
      <button id="updateAppButton" class="btn" type="button" onclick="clearDataWithUI()">Clear Data</button>
    </div>

    <!-- Inline UI elements for non-blocking progress and toasts -->
    <style>
      .update-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: none; align-items: center; justify-content: center; z-index: 9999; }
      .update-overlay .box { background: #fff; padding: 16px 18px; border-radius: 10px; display: flex; gap: 12px; align-items: center; min-width: 260px; box-shadow: 0 6px 20px rgba(0,0,0,0.16); }
      .spinner { width: 28px; height: 28px; border: 4px solid #eee; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .toast-container { position: fixed; top: 16px; right: 16px; z-index: 10000; display: flex; flex-direction: column; gap: 8px; }
      .toast { background: #333; color: #fff; padding: 10px 14px; border-radius: 8px; opacity: 0.98; min-width: 220px; box-shadow: 0 6px 18px rgba(0,0,0,0.12); font-size: 13px; }
      /* Use theme primary colors for success toasts to ensure minimum brightness and consistency */
      .toast.success { background: linear-gradient(90deg, var(--primary) 0%, var(--primary-strong) 100%); }
      .toast.error { background: #c93a3a; }
    </style>

    <div id="updateOverlay" class="update-overlay" role="status" aria-hidden="true">
      <div class="box">
        <div class="spinner" aria-hidden="true"></div>
        <div id="updateStatus">Preparing to clear data…</div>
      </div>
    </div>

    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <div class="card">
      <button id="logoutButton" class="btn btn-black" type="button" onclick="logoutUser()">
        <span class="material-symbols-rounded"> logout </span>
        Logout
      </button>
    </div>
   </section>
